<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101b28"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Dragon RPG - Ember Sanctuary</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b28;color:#f3e8cf;font-family:system-ui,sans-serif}
body{position:fixed;inset:0;overscroll-behavior:none;}
#game{position:fixed;left:0;top:0;width:100vw;height:100dvh;overflow:hidden}
canvas{display:block;width:100%;height:100%;background:#101b28;touch-action:none;outline:none}
#safe-insets{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:radial-gradient(ellipse at center,#293c49,#101b28 70%);padding:24px}
h1{font-family:Georgia,serif;font-size:clamp(24px,4vw,42px);font-weight:500;letter-spacing:.05em;margin:0 0 12px}
p{color:#c9d2d5;line-height:1.5}progress{width:min(340px,75vw);height:12px;accent-color:#d4af6f;margin:12px auto}
#message{font-size:14px}#error{display:none;position:absolute;inset:20%;background:#172735;padding:24px;border:1px solid #d4af6f;border-radius:12px;overflow:auto}
#rotate{display:none;position:absolute;left:10px;right:10px;bottom:8px;text-align:center;background:#101b28dc;border-radius:8px;padding:8px;font-size:12px;pointer-events:none}
@media(orientation:portrait) and (max-width:900px){#rotate{display:block}}
</style></head><body><div id="safe-insets" aria-hidden="true"></div><main id="game"><canvas id="canvas" tabindex="0" aria-label="Dragon RPG game"></canvas>
<div id="loading"><h1>Ember Sanctuary</h1><p>Preparing your dragon&#39;s adventure</p><progress id="progress" max="1" value="0"></progress><p id="message">First visit may take a moment. Progress saves on this device.</p></div>
<div id="error" role="alert"></div><div id="rotate">Turn your phone sideways for the best view.</div></main>
<script>
const config={"dataUrl": "Build/ff4b73a5ffc19f883c596063deb3b5a6.data.unityweb", "frameworkUrl": "Build/8afb898dc2d42b77aa06984b8965a6c1.framework.js.unityweb", "codeUrl": "Build/0691da72845504e51adc79a84a8feb02.wasm.unityweb", "streamingAssetsUrl": "StreamingAssets", "companyName": "Kamp-Dev", "productName": "Dragon RPG", "productVersion": "1.0", "autoSyncPersistentDataPath": true};
let viewportFrame=0;
function fitViewport(){
  viewportFrame=0;
  const canvas=document.getElementById("canvas");canvas.style.width="100%";canvas.style.height="100%";
  const viewport=window.visualViewport, game=document.getElementById('game');
  game.style.width=(viewport?viewport.width:window.innerWidth)+'px';
  game.style.height=(viewport?viewport.height:window.innerHeight)+'px';
  game.style.left=(viewport?viewport.offsetLeft:0)+'px';
  game.style.top=(viewport?viewport.offsetTop:0)+'px';
  if(window.gameInstance){const edge=getComputedStyle(document.getElementById('safe-insets')),w=viewport?viewport.width:window.innerWidth,h=viewport?viewport.height:window.innerHeight;
    const insets=[parseFloat(edge.paddingLeft)/w,parseFloat(edge.paddingBottom)/h,parseFloat(edge.paddingRight)/w,parseFloat(edge.paddingTop)/h].map(x=>Number.isFinite(x)?x:0);
    window.gameInstance.SendMessage('GamePerformance','SetSafeInsets',insets.join(','));}

}
function scheduleViewport(){if(!viewportFrame)viewportFrame=requestAnimationFrame(fitViewport);}
window.addEventListener('resize',scheduleViewport);
window.addEventListener('pageshow',scheduleViewport);
window.addEventListener('focus',scheduleViewport);
document.addEventListener('visibilitychange',scheduleViewport);
window.addEventListener('orientationchange',()=>{scheduleViewport();setTimeout(scheduleViewport,250);setTimeout(scheduleViewport,700);});
if(window.visualViewport){visualViewport.addEventListener('resize',scheduleViewport);visualViewport.addEventListener('scroll',scheduleViewport);}
fitViewport();
// Match Retina screens instead of stretching a lower-resolution canvas.
const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
// Keep text and artwork at the screen's native resolution. Save power through pacing, not blur.
config.devicePixelRatio = window.devicePixelRatio || 1;
function showError(message){document.getElementById('loading').style.display='none';const box=document.getElementById('error');box.style.display='block';box.textContent='The game could not start. Please reload in Safari or Chrome. '+message;}
config.showBanner=(message,type)=>{if(type==='error')showError(message);else console.warn(message);};
const script=document.createElement('script');script.src="Build/8c1bdb7206635bee7d97ce489175dcc0.loader.js";
script.onerror=()=>showError('The game download was interrupted.');
script.onload=()=>createUnityInstance(document.getElementById('canvas'),config,progress=>{document.getElementById('progress').value=progress;}).then(instance=>{window.gameInstance=instance;scheduleViewport();instance.SendMessage("GamePerformance","SetMobile",mobile?"1":"0");document.getElementById('loading').style.display='none';}).catch(showError);
document.body.appendChild(script);
</script></body></html>
