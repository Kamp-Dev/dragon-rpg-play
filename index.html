<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101b28"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Dragon RPG — Ember Sanctuary</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b28;color:#f3e8cf;font-family:system-ui,sans-serif}
body{display:grid;place-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#game{position:relative;width:100%;height:100%;height:100dvh;max-height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%;background:#101b28;touch-action:none;outline:none}
#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:radial-gradient(ellipse at center,#293c49,#101b28 70%);padding:24px}
h1{font-family:Georgia,serif;font-size:clamp(24px,4vw,42px);font-weight:500;letter-spacing:.05em;margin:0 0 12px}
p{color:#c9d2d5;line-height:1.5}progress{width:min(340px,75vw);height:12px;accent-color:#d4af6f;margin:12px auto}
#message{font-size:14px}#error{display:none;position:absolute;inset:20%;background:#172735;padding:24px;border:1px solid #d4af6f;border-radius:12px;overflow:auto}
#rotate{display:none;position:absolute;left:10px;right:10px;bottom:8px;text-align:center;background:#101b28dc;border-radius:8px;padding:8px;font-size:12px;pointer-events:none}
@media(orientation:portrait) and (max-width:900px){#rotate{display:block}}
</style></head><body><main id="game"><canvas id="canvas" tabindex="0" aria-label="Dragon RPG game"></canvas>
<div id="loading"><h1>Ember Sanctuary</h1><p>Preparing your dragon’s adventure</p><progress id="progress" max="1" value="0"></progress><p id="message">First visit may take a moment. Progress saves on this device.</p></div>
<div id="error" role="alert"></div><div id="rotate">Turn your phone sideways for the best view.</div></main>
<script>
const config={"dataUrl": "Build/bba47f4cdf95031c05dadf81239c1b92.data.unityweb", "frameworkUrl": "Build/8cdf62cfda9d0ae8302f902665fcd955.framework.js.unityweb", "codeUrl": "Build/58854b6586ddd14cef734968d9774d43.wasm.unityweb", "streamingAssetsUrl": "StreamingAssets", "companyName": "Kamp-Dev", "productName": "Dragon RPG", "productVersion": "1.0", "autoSyncPersistentDataPath": true};
// Match Retina screens instead of stretching a lower-resolution canvas.
config.devicePixelRatio = window.devicePixelRatio || 1;
function showError(message){document.getElementById('loading').style.display='none';const box=document.getElementById('error');box.style.display='block';box.textContent='The game could not start. Please reload in Safari or Chrome. '+message;}
config.showBanner=(message,type)=>{if(type==='error')showError(message);else console.warn(message);};
const script=document.createElement('script');script.src="Build/b6dd03571ab89d1a95aaafe87f2b90a8.loader.js";
script.onerror=()=>showError('The game download was interrupted.');
script.onload=()=>createUnityInstance(document.getElementById('canvas'),config,progress=>{document.getElementById('progress').value=progress;}).then(instance=>{window.gameInstance=instance;document.getElementById('loading').style.display='none';}).catch(showError);
document.body.appendChild(script);
</script></body></html>
