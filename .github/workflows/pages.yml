name: Publish game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble game data
        shell: python
        run: |
          import json, pathlib, hashlib
          for item in json.loads(pathlib.Path('parts.json').read_text()):
              data = b''.join(pathlib.Path(p).read_bytes() for p in item['parts'])
              assert hashlib.sha256(data).hexdigest() == item['sha256']
              pathlib.Path(item['file']).write_bytes(data)
              for part in item['parts']: pathlib.Path(part).unlink()
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
